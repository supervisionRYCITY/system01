<div id="loginModal" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" onclick="closeModal('loginModal')"></div>
  <div class="relative bg-white rounded-xl max-w-sm w-full doc-card">
    <div class="flex items-center justify-between px-5 py-4 border-b border-line">
      <h3 class="text-base font-semibold text-navy">เข้าสู่ระบบสำหรับบุคลากร</h3>
      <button onclick="closeModal('loginModal')" class="text-ink/40 hover:text-ink" aria-label="ปิด">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>
    <form id="loginForm" class="px-5 py-4 space-y-4" onsubmit="return handleLoginSubmit(event)">
      <div>
        <label for="loginUsername" class="block text-xs font-medium text-ink/60 mb-1">ชื่อผู้ใช้งาน</label>
        <input type="text" id="loginUsername" autocomplete="username"
               class="w-full px-3 py-2 rounded-lg border border-line text-sm focus:outline-none focus:border-navy">
      </div>
      <div>
        <label for="loginPassword" class="block text-xs font-medium text-ink/60 mb-1">รหัสผ่าน</label>
        <input type="password" id="loginPassword" autocomplete="current-password"
               class="w-full px-3 py-2 rounded-lg border border-line text-sm focus:outline-none focus:border-navy">
      </div>
      <p id="loginError" class="hidden text-xs text-red-600"></p>
      <button type="submit" id="loginSubmitBtn"
              class="w-full py-2.5 rounded-lg bg-navy text-white text-sm font-medium hover:bg-navy-dark disabled:opacity-60">
        เข้าสู่ระบบ
      </button>
    </form>
  </div>
</div>
