<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ข้อมูลสถิตินักเรียน | Supervision+</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sarabun: ['Sarabun', 'sans-serif'] },
          colors: {
            navy: { DEFAULT: '#0E3B5C', dark: '#092A42', light: '#15537D' },
            gold: { DEFAULT: '#C08A2E', light: '#E0B563', pale: '#F5E9D2' },
            teal: { DEFAULT: '#0F6E56', light: '#DCEEE8' },
            paper: '#F7F6F2',
            ink: '#1F2A33',
            line: '#E2DFD6',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sarabun bg-paper text-ink">

  <div class="flex min-h-screen">

    <div class="flex-1 flex flex-col min-w-0">
      <div id="headerContainer"></div>

      <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6 space-y-6 w-full">
        <section>
          <h2 class="text-lg font-semibold text-navy mb-1">ข้อมูลสถิตินักเรียน</h2>
          <p class="text-sm text-ink/60 mb-4">แสดงจำนวนนักเรียนล่าสุดของแต่ละสถานศึกษา ผู้ดูแลระบบแก้ไขได้ทุกโรงเรียน ผู้อำนวยการแก้ไขได้เฉพาะโรงเรียนของตนเอง</p>
          <div id="schoolStatsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <p class="text-sm text-ink/40">กำลังโหลด...</p>
          </div>
        </section>
      </main>
    </div>

    <div id="sidebarContainer"></div>
  </div>

  <div id="loginModalContainer"></div>

  <!-- ============ Modal: แก้ไขข้อมูลนักเรียน ============ -->
  <div id="schoolStatFormModal" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/50" onclick="closeModal('schoolStatFormModal')"></div>
    <div class="relative bg-white rounded-xl max-w-md w-full doc-card">
      <div class="flex items-center justify-between px-5 py-4 border-b border-line">
        <div>
          <h3 class="text-base font-semibold text-navy">แก้ไขข้อมูลนักเรียน</h3>
          <p id="schoolStatFormSchoolName" class="text-xs text-ink/50"></p>
        </div>
        <button onclick="closeModal('schoolStatFormModal')" class="text-ink/40 hover:text-ink" aria-label="ปิด">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <form id="schoolStatForm" class="px-5 py-4 space-y-3" onsubmit="return handleSchoolStatFormSubmit(event)">
        <input type="hidden" id="schoolStatFormSchoolId">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-ink/60 mb-1">ปีการศึกษา (พ.ศ.)</label>
            <input type="number" id="schoolStatFormYear" required class="w-full px-3 py-2 rounded-lg border border-line text-sm focus:outline-none focus:border-navy">
          </div>
          <div>
            <label class="block text-xs font-medium text-ink/60 mb-1">ภาคเรียนที่</label>
            <select id="schoolStatFormSemester" required class="w-full px-3 py-2 rounded-lg border border-line text-sm focus:outline-none focus:border-navy bg-white">
              <option value="1">1</option>
              <option value="2">2</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-ink/60 mb-1">จำนวนนักเรียนชาย</label>
            <input type="number" min="0" id="schoolStatFormMale" required class="w-full px-3 py-2 rounded-lg border border-line text-sm focus:outline-none focus:border-navy">
          </div>
          <div>
            <label class="block text-xs font-medium text-ink/60 mb-1">จำนวนนักเรียนหญิง</label>
            <input type="number" min="0" id="schoolStatFormFemale" required class="w-full px-3 py-2 rounded-lg border border-line text-sm focus:outline-none focus:border-navy">
          </div>
        </div>
        <p id="schoolStatFormError" class="hidden text-xs text-red-600"></p>
        <button type="submit" id="schoolStatFormSubmitBtn" class="w-full py-2.5 rounded-lg bg-navy text-white text-sm font-medium hover:bg-navy-dark disabled:opacity-60">
          บันทึก
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.1/sweetalert2.all.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/schoolStats.js"></script>
</body>
</html>
